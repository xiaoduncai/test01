function makeSprite(grid, pal, scale){
  const s = document.createElement('canvas');
  s.width = grid[0].length*scale; s.height = grid.length*scale;
  const c = s.getContext('2d');
  grid.forEach((row,r)=>{ [...row].forEach((ch,col)=>{
    if(pal[ch]){ c.fillStyle=pal[ch]; c.fillRect(col*scale,r*scale,scale,scale); } }); });
  return s;
}

/* ================= 存档 ================= */
const SAVE_KEY = "fali_game_v1";
function loadSave(){
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {unlocked:1, done:{}, prog:null}; }
  catch(e){ return {unlocked:1, done:{}, prog:null}; }
}
function writeSave(s){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){/*存储不可用时静默跳过*/} }
let SAVE = loadSave();

/* ================= 状态 ================= */
const S = { screen:"title", ch:0, ei:0, ehp:0, php:5, charge:0, q:null,
            phase:"idle", t:0, tmax:10, shake:0, flash:0, floats:[], qi:0, correct:0, total:0, hover:-1, bossMode:false };

const enemy = () => S.ch>=3 ? FINAL_BOSS : CHAPTERS[S.ch].enemies[S.ei];
const chapter = () => S.ch>=3 ? FINAL_CHAPTER : CHAPTERS[S.ch];

/* ================= 流程 ================= */
function startChapter(ch){
  S.ch = ch; S.ei = 0; S.php = 5; S.charge = 0; S.correct = 0; S.total = 0;
  loadEnemy();
}
function loadEnemy(){
  const E = enemy();
  S.ehp = E.hp; S.qi = 0;
  log(`<span class="gold">⚔ ${chapter().title}</span><br><span style="color:#8fd3ff">遭遇 ${E.name}（${E.title}）</span>　质疑力 ${E.hp} 格`);
  nextQuestion();
}
function nextQuestion(){ S.q = QB[enemy().q[S.qi]]; S.q.hl=-1; S.q.lock=false; S.q.expShow=false; S.t=S.tmax; S.phase="question"; saveProg(); }
function saveProg(){
  SAVE.prog = {ch:S.ch, ei:S.ei, ehp:S.ehp, php:S.php, charge:S.charge, qi:S.qi, correct:S.correct, total:S.total};
  writeSave(SAVE);
}
function answer(i){
  if(S.q.lock) return;
  S.q.lock = true; S.q.hl = i; S.q.expShow = true; S.total++;
  if(i === S.q.a){
    S.correct++; S.ehp--; S.charge = Math.min(3, S.charge+1);
    S.shake=1; S.flash=8; floatText(W-200,130,"反驳成功!!","#57cc99");
    log(`<span style="color:#57cc99">✔ 反驳成功！</span>${S.q.exp}<br>质疑力 -1　极技 ${S.charge}/3`);
  } else {
    S.php--; S.shake=1; floatText(430,H-100,"被驳倒!","#ff6b6b");
    log(`<span style="color:#ff6b6b">✘ 回答错误！正确答案是 ${"ABCD"[S.q.a]}</span><br>${S.q.exp}<br>发言力 -1`);
  }
  setTimeout(nextTurn, 1800);
}
function nextTurn(){
  if(S.ehp<=0){
    if(S.ei >= chapter().enemies.length-1){
      SAVE.done[S.ch] = true;
      SAVE.unlocked = Math.max(SAVE.unlocked, Math.min(3, S.ch+2));
      if(S.ch===2 && !S.bossMode){
        S.bossMode = true; S.ch = 3; S.ei = 0; S.php = 5; S.charge = 0; S.qi = 0;
        SAVE.prog = null; writeSave(SAVE);
        log('<span style="color:#ff6b6b">★ 隐藏Boss突入！</span>卢梭 · 制霸！社会契约 —— 发言力回满，终极辩论开始！');
        loadEnemy(); return;
      }
      if(S.ch>=3) SAVE.done["boss"] = true;
      SAVE.prog = null; writeSave(SAVE);
      S.screen = "win";
      return;
    }
    S.ei++; S.qi=0; loadEnemy(); return;
  }
  if(S.php<=0){ SAVE.prog=null; writeSave(SAVE); S.screen="lose"; return; }
  S.qi = (S.qi+1) % enemy().q.length;
  nextQuestion();
}
function ult(){
  if(S.charge<3 || !S.q || S.q.lock) return;
  S.charge=0; S.q.lock=true; S.q.expShow=true;
  S.ehp=Math.max(0,S.ehp-2); S.shake=2; S.flash=10;
  floatText(W-200,110,"正义一击!!","#ffd166");
  log(`<span style="color:#ffd166">★ 发动极技『正义一击』！</span>质疑力 -2`);
  setTimeout(nextTurn, 1800);
}

/* ================= 绘制 ================= */
function bar(x,y,n,max,c1){
  for(let i=0;i<max;i++){
    ctx.fillStyle = i<n?c1:"#3a3f5e"; ctx.fillRect(x+i*40,y,34,14);
    ctx.strokeStyle="#0f1020"; ctx.lineWidth=2; ctx.strokeRect(x+i*40,y,34,14);
  }
}
function floatText(x,y,s,c){ S.floats.push({x,y,s,c,t:60}); }

function drawTitle(){
  ctx.textAlign="center";
  ctx.fillStyle="#8fd3ff"; ctx.font="bold 32px Microsoft YaHei"; ctx.fillText("课堂大乱斗：法理篇", W/2, 90);
  ctx.fillStyle="#ffd166"; ctx.font="16px Microsoft YaHei"; ctx.fillText("以答题为剑，驳倒历代思想家与法学家！", W/2, 122);

  /* 章节按钮 */
  for(let i=0;i<3;i++){
    const bx = 90 + i*235, by = 160, bw = 210, bh = 120;
    const locked = i+1 > SAVE.unlocked;
    ctx.fillStyle = locked ? "#22243a" : "#2f3350";
    ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle = locked ? "#3a3f5e" : "#8fd3ff"; ctx.lineWidth=3; ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle = locked ? "#555a78" : "#e8e8f0"; ctx.font="bold 15px Microsoft YaHei";
    ctx.fillText(CHAPTERS[i].title, bx+bw/2, by+34);
    ctx.font="13px Microsoft YaHei";
    ctx.fillStyle = locked ? "#555a78" : "#8899bb";
    ctx.fillText(locked ? "🔒 未解锁" : `${CHAPTERS[i].enemies.length} 名敌人 · ${CHAPTERS[i].enemies.reduce((s,e)=>s+e.hp,0)} 题`, bx+bw/2, by+62);
    if(SAVE.done[i]){ ctx.fillStyle="#57cc99"; ctx.fillText("✔ 已通过", bx+bw/2, by+88); }
    if(!locked && SAVE.prog && SAVE.prog.ch===i){ ctx.fillStyle="#ffd166"; ctx.fillText("● 有存档", bx+bw/2, by+108); }
  }
  if(SAVE.prog){
    ctx.fillStyle="#ffd166"; ctx.font="bold 16px Microsoft YaHei";
    ctx.fillText("▶ 点击对应章节继续上次进度（自动续战）", W/2, 330);
  }
  if(SAVE.prog && SAVE.prog.ch>=3){
    ctx.fillStyle="#6b1f2a"; ctx.fillRect(W/2-170,338,340,36);
    ctx.strokeStyle="#ff6b6b"; ctx.lineWidth=3; ctx.strokeRect(W/2-170,338,340,36);
    ctx.fillStyle="#ffd166"; ctx.font="bold 15px Microsoft YaHei";
    ctx.fillText("★ 隐藏Boss战进行中 · 点击此处续战", W/2, 362);
  }
  if(SAVE.done["boss"]){
    ctx.fillStyle="#ffd166"; ctx.font="bold 18px Microsoft YaHei";
    ctx.fillText("👑 全制霸达成：社会契约已被征服！", W/2, 402);
  }
  ctx.fillStyle="#8899bb"; ctx.font="13px Microsoft YaHei";
  ctx.fillText("鼠标点击 / 数字键1-4 作答　空格键 发动极技", W/2, 380);
  ctx.fillStyle="#555a78"; ctx.font="12px Microsoft YaHei";
  ctx.fillText("（页面下方灰色横条为重置存档区）", W/2, 410);
  ctx.fillStyle="#3a3f5e"; ctx.fillRect(W/2-80, 425, 160, 26);
  ctx.fillStyle="#ff6b6b"; ctx.fillText("重置全部进度", W/2, 443);
  ctx.textAlign="left";
}

function drawBattle(){

  /* 顶栏 */
  ctx.fillStyle="#252a45"; ctx.fillRect(0,0,W,44);
  ctx.fillStyle="#8fd3ff"; ctx.font="14px Microsoft YaHei";

  /* 敌方 */
  ctx.fillStyle="#ff9d76"; ctx.font="12px Microsoft YaHei"; ctx.fillText("敌方", 20, 66);
  ctx.fillStyle="#ffd166"; ctx.font="bold 16px Microsoft YaHei"; ctx.fillText(`${E.name} · ${E.title}`, 60, 66);
  bar(560, 54, S.ehp, E.hp, "#e5484d");

  const qt = "【敌方攻击】" + S.q.q, maxw = 556;

  else {
    let cut = qt.length;
    while(cut>0 && ctx.measureText(qt.slice(0,cut)).width > maxw) cut--;
    ctx.fillText(qt.slice(0,cut), 34, 180);

  S.q.opts.forEach((o,i)=>{
    const ox = 20+(i%2)*(W/2-14), oy = 240+Math.floor(i/2)*52, w = W/2-34, h = 44;

    ctx.fillText(`${"ABCD"[i]}. ${o}`, ox+14, oy+28);
  });

  if(S.q.expShow){
    ctx.fillStyle="#2f3350"; ctx.fillRect(20,352,W-40,40);
    ctx.strokeStyle="#565b7c"; ctx.lineWidth=2; ctx.strokeRect(20,352,W-40,40);
    ctx.fillStyle="#c7f464"; ctx.font="13px Microsoft YaHei";
    ctx.fillText("📖 " + S.q.exp, 34, 377);
  }

  /* 敌方 FC 风像素头像 */
  const spr = PORTRAITS[E.sprite], dw=140, dh=140, sx=W-36-dw, sy=72;
  ctx.drawImage(spr, sx, sy, dw, dh);
  if(S.flash>0){ ctx.globalAlpha=S.flash/10; ctx.fillStyle="#fff"; ctx.fillRect(sx,sy,dw,dh); ctx.globalAlpha=1; }

  /* 玩家区 */
  ctx.fillStyle="#252a45"; ctx.fillRect(0,H-58,W,58);
  ctx.fillStyle="#c7f464"; ctx.font="bold 14px Microsoft YaHei"; ctx.fillText("玩家：法学新生", 14, H-34);
  ctx.drawImage(SPRITES.player, 200, H-86);
  ctx.fillStyle="#8fd3ff"; ctx.font="12px Microsoft YaHei"; ctx.fillText("发言力", 330, H-40);
  bar(380, H-50, S.php, 5, "#57cc99");
  ctx.fillStyle="#ffd166"; ctx.font="12px Microsoft YaHei"; ctx.fillText("极技:正义一击", 330, H-20);
  ctx.fillStyle="#3a3f5e"; ctx.fillRect(440, H-28, 220, 12);
  ctx.fillStyle="#ffd166"; ctx.fillRect(440, H-28, 220*S.charge/3, 12);
  ctx.strokeStyle="#0f1020"; ctx.strokeRect(440, H-28, 220, 12);
  /* 极技按钮（支持触屏点击） */
  ctx.fillStyle = S.charge>=3 ? "#6b1f2a" : "#2a2d45";
  ctx.fillRect(672, H-40, 158, 30);
  ctx.strokeStyle = S.charge>=3 ? "#ff6b6b" : "#565b7c"; ctx.lineWidth=3;
  ctx.strokeRect(672, H-40, 158, 30);
  ctx.fillStyle = S.charge>=3 ? "#ffd166" : "#555a78";
  ctx.font="bold 14px Microsoft YaHei"; ctx.textAlign="center";
  ctx.fillText(S.charge>=3 ? "⚡ 发动极技!" : "极技充能中", 751, H-20);
  ctx.textAlign="left";

  S.floats.forEach(f=>{
    ctx.globalAlpha=f.t/60; ctx.fillStyle=f.c; ctx.font="bold 22px Microsoft YaHei";
    ctx.textAlign="center"; ctx.fillText(f.s, f.x, f.y-(60-f.t)*0.8); ctx.textAlign="left"; ctx.globalAlpha=1;
  });
}

function drawOverlay(title, c1, sub){
  ctx.fillStyle="rgba(10,10,25,0.85)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle=c1; ctx.font="bold 34px Microsoft YaHei"; ctx.fillText(title, W/2, H/2-16);
  ctx.fillStyle="#e8e8f0"; ctx.font="15px Microsoft YaHei"; ctx.fillText(sub, W/2, H/2+20);
  ctx.fillStyle="#8fd3ff"; ctx.font="14px Microsoft YaHei";
  ctx.fillText(S.screen==="chclear" ? "— 点击进入下一章 —" : "— 点击返回标题 —", W/2, H/2+52);
  ctx.textAlign="left";
}

function draw(){
  ctx.save();
  if(S.shake>0) ctx.translate((Math.random()-0.5)*S.shake*8,(Math.random()-0.5)*S.shake*8);
  ctx.fillStyle="#1a1c2c"; ctx.fillRect(-10,-10,W+20,H+20);

  if(S.screen==="title"){ drawTitle(); ctx.restore(); return; }
  if(S.screen==="battle"){ drawBattle(); ctx.restore(); return; }
  drawBattle();
  if(S.screen==="chclear") drawOverlay(`${chapter().title} · 通过！`, "#57cc99", `本章正确率 ${S.total?Math.round(S.correct/S.total*100):0}%（${S.correct}/${S.total}）`);
  if(S.screen==="win")    drawOverlay(S.bossMode?"👑 制霸！社会契约已被你征服！":"全部章节通过！", "#57cc99", `总正确率 ${S.total?Math.round(S.correct/S.total*100):0}%（${S.correct}/${S.total}）`);
  if(S.screen==="lose")   drawOverlay("发言力耗尽……被驳倒了", "#ff6b6b", "点击返回标题，可重新挑战本章");
  ctx.restore();
}

/* ================= 输入 ================= */
function resumeProg(){
  const p = SAVE.prog;
  S.ch=p.ch; S.ei=p.ei; S.ehp=p.ehp; S.php=p.php; S.charge=p.charge; S.qi=p.qi;
  S.correct=p.correct; S.total=p.total; S.bossMode=(p.ch>=3); S.screen="battle";
  log(`<span style="color:#ffd166">● 续战：</span>${chapter().title} — ${enemy().name}`);
  nextQuestion();
}

cv.addEventListener('click', e=>{
  const r = cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*W/r.width, my=(e.clientY-r.top)*H/r.height;

  if(S.screen==="title"){
    if(mx>=W/2-80 && mx<=W/2+80 && my>=425 && my<=451){
      SAVE = {unlocked:1, done:{}, prog:null}; writeSave(SAVE);
      log("已重置全部进度"); return;
    }
    if(SAVE.prog && SAVE.prog.ch>=3 && mx>=W/2-170 && mx<=W/2+170 && my>=338 && my<=374){ resumeProg(); return; }
    for(let i=0;i<3;i++){
      const bx=90+i*235, by=160;
      if(mx>=bx && mx<=bx+210 && my>=by && my<=by+120){
        if(i+1 > SAVE.unlocked){ log("该章尚未解锁，请先通过上一章"); return; }
        if(SAVE.prog && SAVE.prog.ch===i){ resumeProg(); return; }
        S.screen="battle"; startChapter(i); return;
      }
    }
    return;
  }
  if(S.screen==="chclear"){ S.screen="battle"; startChapter(S.ch+1); return; }
  if(S.screen==="lose"){
    if(S.bossMode){ S.php=5; S.charge=0; loadEnemy(); S.screen="battle"; return; }
    S.screen="title"; return;
  }
  if(S.screen==="win"){ S.screen="title"; return; }
  /* battle */
  if(S.charge>=3 && mx>=672 && mx<=830 && my>=H-40 && my<=H-10){ ult(); return; }
  S.q && S.q.opts.forEach((o,i)=>{
    const ox=20+(i%2)*(W/2-14), oy=240+Math.floor(i/2)*52;
    if(mx>=ox && mx<=ox+W/2-34 && my>=oy && my<=oy+44) answer(i);
  });
});
cv.addEventListener('mousemove', e=>{
  if(S.screen!=="battle") return;
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)*W/r.width, my=(e.clientY-r.top)*H/r.height;
  S.hover=-1;
  S.q && S.q.opts.forEach((o,i)=>{
    const ox=20+(i%2)*(W/2-14), oy=240+Math.floor(i/2)*52;
    if(mx>=ox && mx<=ox+W/2-34 && my>=oy && my<=oy+44) S.hover=i;
  });
});
addEventListener('keydown', e=>{
  if(e.key===" "){ e.preventDefault(); if(S.screen==="battle") ult(); return; }
  if(S.screen==="title" || !S.q) return;
  const n = parseInt(e.key);
  if(n>=1 && n<=4) answer(n-1);
});

/* ================= 主循环 ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  if(S.screen==="battle" && S.phase==="question" && S.q && !S.q.lock){
    S.t -= dt;
    if(S.t<=0){
      S.q.lock=true; S.q.hl=-1; S.q.expShow=true; S.total++; S.php--;
      S.shake=1; floatText(430,H-100,"超时未答!","#ff6b6b");
      log(`<span style="color:#ff6b6b">⏰ 超时！</span>正确答案是 ${"ABCD"[S.q.a]}，发言力 -1`);
      setTimeout(nextTurn, 1800);
    }
  }
  S.shake*=0.85; if(S.flash>0)S.flash--;
  S.floats = S.floats.filter(f=>--f.t>0);
  draw();
  requestAnimationFrame(loop);
}
log("欢迎来到课堂大乱斗：法理篇！选择章节开始辩论。");
requestAnimationFrame(loop);
</script>
